<!doctype html><html><head><meta charset="utf-8"><title>Multistep</title></head><body>
<h1>Wizard</h1><div id="stage">step 1</div>
<button id="next">Next</button><div id="done" style="display:none">ALL DONE</div>
<script>
var n=1;document.getElementById('next').addEventListener('click',function(){
  n++;document.getElementById('stage').textContent='step '+n;
  if(n>=3){document.getElementById('done').style.display='block';document.getElementById('next').style.display='none';}
});
</script></body></html>
