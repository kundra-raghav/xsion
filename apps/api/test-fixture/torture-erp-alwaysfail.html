<!-- TEST HARNESS — a copy of torture-erp.html with api() FORCED to always apply-then-500 (roll=0, appliedAnyway=true).
     Every write reports failure (a "(500)" toast) yet PERSISTS. This deterministically triggers the "applied-despite-
     failure" bug so the break-it oracle (brokeOnApplyDespiteFailure + transient-alert capture) can be regression-tested:
     break-it:Flag against this must emit `broke` on priority/hold. NOT a real app; do not use as a normal fixture. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Antonov Fulfillment ERP — Ops Console</title>
<style>
  /* ============ INLINE CSS — deliberately mixes semantic + non-semantic + ambiguous ============ */
  :root{--bg:#0f1218;--panel:#171c26;--panel2:#1d2431;--line:#2a3342;--txt:#e6ebf2;--dim:#8b97a8;--acc:#3b82f6;--good:#22c55e;--warn:#f59e0b;--bad:#ef4444;--pend:#a855f7;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--txt);padding:6px 12px;border-radius:6px;}
  button:hover{background:#26304050;}
  button:disabled{opacity:.4;cursor:not-allowed;}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff;}
  button.danger{background:var(--bad);border-color:var(--bad);color:#fff;}
  button.ghost{background:transparent;}
  button.tiny{padding:3px 8px;font-size:12px;}
  input,select,textarea{font:inherit;background:#0c0f15;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;}
  input[disabled]{opacity:.5;}
  .hidden{display:none !important;}
  .row{display:flex;gap:10px;align-items:center;}
  .col{display:flex;flex-direction:column;gap:10px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;}
  .muted{color:var(--dim);}
  .pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;border:1px solid var(--line);}
  .pill.draft{color:var(--dim);} .pill.submitted{color:var(--acc);border-color:var(--acc);}
  .pill.approved{color:var(--good);border-color:var(--good);} .pill.rejected{color:var(--bad);border-color:var(--bad);}
  .pill.allocated{color:var(--pend);border-color:var(--pend);} .pill.shipped{color:#38bdf8;border-color:#38bdf8;}
  .pill.flagged{color:var(--warn);border-color:var(--warn);}
  /* login */
  #loginScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 50% -10%, #1a2440, var(--bg));}
  #loginCard{width:360px;}
  /* topbar */
  #topbar{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;}
  #topbar .brand{font-weight:700;letter-spacing:.5px;}
  #topbar .spacer{flex:1;}
  .badge{font-size:12px;padding:3px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);}
  /* layout */
  #shell{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 49px);}
  #sidebar{background:var(--panel);border-right:1px solid var(--line);padding:12px 8px;}
  .navItem{padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--dim);display:flex;justify-content:space-between;}
  .navItem:hover{background:#26304040;color:var(--txt);}
  .navItem.active{background:#26304090;color:#fff;}
  .navItem small{opacity:.5;}
  #main{padding:18px 22px;overflow:auto;max-height:calc(100vh - 49px);}
  h1{font-size:20px;margin:0 0 4px;} h2{font-size:15px;margin:18px 0 8px;}
  table{width:100%;border-collapse:collapse;} th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);}
  th{color:var(--dim);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px;}
  tr[data-row]{cursor:pointer;} tr[data-row]:hover{background:#1c2534;}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111826;border:1px solid var(--line);padding:12px 18px;border-radius:10px;z-index:100;box-shadow:0 8px 30px #0008;}
  .toast.good{border-color:var(--good);} .toast.bad{border-color:var(--bad);} .toast.warn{border-color:var(--warn);}
  /* modal (focus-trapping, nested-capable) */
  .modalWrap{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:200;}
  .modal{width:min(560px,92vw);max-height:86vh;overflow:auto;}
  /* drawer */
  .drawer{position:fixed;top:0;right:0;height:100vh;width:min(440px,94vw);background:var(--panel);border-left:1px solid var(--line);z-index:150;padding:18px;overflow:auto;transform:translateX(100%);transition:transform .28s;}
  .drawer.open{transform:translateX(0);}
  /* kanban / dnd */
  .board{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;}
  .lane{min-width:230px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;}
  .lane h3{margin:2px 4px 10px;font-size:13px;color:var(--dim);}
  .chip{background:#0c111a;border:1px solid var(--line);border-radius:8px;padding:9px;margin-bottom:8px;cursor:grab;}
  .chip.drag{opacity:.4;} .lane.over{outline:2px dashed var(--acc);}
  /* combobox */
  .combo{position:relative;} .comboMenu{position:absolute;top:100%;left:0;right:0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;margin-top:3px;z-index:20;max-height:200px;overflow:auto;}
  .comboOpt{padding:8px 10px;cursor:pointer;} .comboOpt:hover{background:#26304090;}
  /* wizard */
  .steps{display:flex;gap:6px;margin-bottom:14px;} .step{flex:1;text-align:center;padding:6px;border-radius:6px;background:var(--panel2);color:var(--dim);font-size:12px;}
  .step.active{background:var(--acc);color:#fff;} .step.done{background:#1e3a2f;color:var(--good);}
  /* infinite/virtual list */
  #bigList{height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px;}
  .listRow{padding:8px 12px;border-bottom:1px solid var(--line);}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line);}
  .danger-zone{border:1px solid var(--bad);border-radius:10px;padding:14px;margin-top:22px;}
</style>
</head>
<body>

<!-- ========================= LOGIN GATE ========================= -->
<div id="loginScreen">
  <div class="card" id="loginCard">
    <h1>Antonov Fulfillment ERP</h1>
    <p class="muted" style="margin-top:2px">Ops Console · sign in to continue</p>
    <div class="col" style="margin-top:14px">
      <div><label class="muted">Username</label><input id="loginUser" placeholder="username" autocomplete="off"/></div>
      <div><label class="muted">Password</label><input id="loginPass" type="password" placeholder="password" autocomplete="off"/></div>
      <div id="loginErr" class="hidden" style="color:var(--bad);font-size:13px"></div>
      <button class="primary" id="loginBtn" style="margin-top:6px">Sign In</button>
      <details style="margin-top:6px"><summary class="muted" style="cursor:pointer;font-size:12px">Demo credentials</summary>
        <div class="muted" style="font-size:12px;margin-top:6px;line-height:1.7">
          admin / admin123 &nbsp;·&nbsp; editor / editor123 &nbsp;·&nbsp; operator / operator123
        </div>
      </details>
    </div>
  </div>
</div>

<!-- ========================= APP SHELL ========================= -->
<div id="app" class="hidden">
  <div id="topbar">
    <span class="brand">◮ ANTONOV ERP</span>
    <span class="badge" id="roleBadge">—</span>
    <span class="spacer"></span>
    <span class="muted" id="clock" style="font-size:12px"></span>
    <button class="ghost tiny" id="notifBtn" aria-label="Notifications">🔔 <span id="notifCount">0</span></button>
    <button class="ghost tiny" id="whoami">—</button>
    <button class="ghost tiny" id="logoutBtn">Logout</button>
  </div>
  <div id="shell">
    <div id="sidebar" class="col" style="gap:4px"></div>
    <div id="main"></div>
  </div>
</div>

<div id="toastHost"></div>
<div id="modalHost"></div>
<div id="drawerHost"></div>

<script>
/* =====================================================================================
   ANTONOV FULFILLMENT ERP — single-file adversarial fixture
   Roles: admin / editor / operator (hardcoded creds). Full cascade:
     operator CREATES orders -> editor APPROVES + ALLOCATES stock -> admin sets RULES
     that RETRO-CHANGE already-approved orders (price rules, credit holds, SLA flags).
   Centerpiece torture: VERIFY-BY-EFFECT HELL — a fake in-page API with latency + random
   500s; silent writes; a toast that sometimes LIES; optimistic updates that REVERT.
   Fully functional + localStorage-backed → real ground truth to verify against.
   ===================================================================================== */

/* ---------- tiny helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,v]of Object.entries(a)){if(x==='class')e.className=v;else if(x==='html')e.innerHTML=v;else if(x.startsWith('on'))e.addEventListener(x.slice(2),v);else if(v!=null)e.setAttribute(x,v);}k.flat().forEach(c=>e.append(c?.nodeType?c:document.createTextNode(c)));return e;};
const money=n=>'$'+(n/100).toFixed(2);
const uid=p=>p+'-'+Math.random().toString(36).slice(2,7);
const now=()=>Date.now();

/* ---------- persistence ---------- */
const DB_KEY='antonov_erp_v1';
function load(){try{return JSON.parse(localStorage.getItem(DB_KEY))||null;}catch{return null;}}
function persist(){try{localStorage.setItem(DB_KEY,JSON.stringify(DB));}catch{}}
function seed(){
  const products=[
    {sku:'ANV-100',name:'Freight Crate L',price:12000,stock:14},
    {sku:'ANV-200',name:'Pallet Wrap',price:850,stock:120},
    {sku:'ANV-300',name:'Cold Chain Box',price:23000,stock:3},
    {sku:'ANV-400',name:'Hazmat Liner',price:4600,stock:0},
    {sku:'ANV-500',name:'Standard Carton',price:300,stock:640},
  ];
  return {
    v:1,
    products,
    orders:[
      {id:'ORD-1001',customer:'Doon Logistics',region:'APAC',items:[{sku:'ANV-100',qty:2},{sku:'ANV-500',qty:50}],status:'submitted',priority:'normal',createdBy:'operator',createdAt:now()-86400000,note:'',flags:[],allocatedBy:null,approvedBy:null,priceRuleApplied:null},
      {id:'ORD-1002',customer:'NZ Curriculum Board',region:'APAC',items:[{sku:'ANV-300',qty:4}],status:'approved',priority:'high',createdBy:'operator',createdAt:now()-3600000,note:'temperature sensitive',flags:[],allocatedBy:null,approvedBy:'editor',priceRuleApplied:null},
      {id:'ORD-1003',customer:'Meridian Foods',region:'EMEA',items:[{sku:'ANV-400',qty:10}],status:'draft',priority:'low',createdBy:'operator',createdAt:now()-120000,note:'',flags:[],allocatedBy:null,approvedBy:null,priceRuleApplied:null},
    ],
    shipments:[],
    invoices:[],
    rules:{ marginPct:15, creditHoldRegions:[], hazmatRequiresFlag:true, autoFlagOver:500000 },
    audit:[],
    notifs:[],
    nextOrd:1004,
  };
}
let DB=load()||seed();

/* ---------- session ---------- */
const CREDS={admin:'admin123',editor:'editor123',operator:'operator123'};
const ROLE_CAPS={
  admin:{nav:['dashboard','orders','inventory','shipments','invoices','rules','audit','users','danger'],can:['approve','allocate','ship','invoice','rule','delete','flag','create']},
  editor:{nav:['dashboard','orders','inventory','shipments','board'],can:['approve','allocate','ship','flag','create']},
  operator:{nav:['dashboard','orders','create','bigdata'],can:['create']},
};
let SESSION=null; // {role}
const NAV_META={dashboard:'#/dash',orders:'#/orders',inventory:'#/inv',shipments:'#/ship',invoices:'#/inv2',rules:'#/rules',audit:'#/audit',users:'#/users',create:'#/new',board:'#/board',bigdata:'#/big',danger:'#/danger'};
const NAV_LABEL={dashboard:'Dashboard',orders:'Orders',inventory:'Inventory',shipments:'Shipments',invoices:'Invoices',rules:'Rules Engine',audit:'Audit Log',users:'Users',create:'New Order',board:'Allocation Board',bigdata:'Data Explorer',danger:'System'};

/* ---------- FAKE API (the verify-by-effect torture core) ----------
   Every mutation goes through here. It:
   - has variable latency (400–1400ms)
   - randomly returns 500 ~12% of the time (write may or may not have applied — sometimes it DID apply then "failed")
   - sometimes applies OPTIMISTICALLY then REVERTS on the async "server" rejection
   - fires a real network-ish console marker so an observer sees traffic, but NO reliable UI signal
*/
let API_SEQ=0;
function api(action,payload){
  const seq=++API_SEQ;
  const latency=400+Math.floor(Math.random()*1000);
  console.log('[API→]',seq,action,JSON.stringify(payload).slice(0,80));
  return new Promise((resolve)=>{
    setTimeout(()=>{
      const roll=0;  // FORCED: always the 500 path
      // 12% hard failure — but HALF of those still MUTATED before "failing" (the nastiest verify case)
      if(true){  // FORCED always-fail
        const appliedAnyway=true;  // FORCED applied-anyway
        if(appliedAnyway){try{MUT[action]&&MUT[action](payload);persist();}catch{}}
        console.log('[API←]',seq,action,'500',appliedAnyway?'(but applied!)':'(not applied)');
        resolve({ok:false,status:500,appliedAnyway});
        return;
      }
      let res={ok:true,status:200};
      try{ res.data = MUT[action]?MUT[action](payload):null; }catch(e){ res={ok:false,status:400,error:String(e.message)}; }
      persist();
      console.log('[API←]',seq,action,res.status);
      resolve(res);
    },latency);
  });
}

/* ---------- the actual mutations (ground truth lives here) ---------- */
const MUT={
  createOrder(p){
    const id='ORD-'+(DB.nextOrd++);
    const o={id,customer:p.customer,region:p.region,items:p.items,status:'draft',priority:p.priority||'normal',createdBy:SESSION.role,createdAt:now(),note:p.note||'',flags:[],allocatedBy:null,approvedBy:null,priceRuleApplied:null};
    applyRulesTo(o);
    DB.orders.unshift(o); audit('create',id,`by ${SESSION.role}`); notify(`New order ${id} from ${SESSION.role}`,'operator-created'); return {id};
  },
  submitOrder(p){ const o=ord(p.id); if(!o)throw new Error('gone'); o.status='submitted'; audit('submit',o.id); notify(`${o.id} submitted for approval`,'submitted'); return {status:o.status}; },
  approveOrder(p){ const o=ord(p.id); if(!o)throw new Error('gone'); if(o.status!=='submitted')throw new Error('not submittable state: '+o.status); o.status='approved'; o.approvedBy=SESSION.role; audit('approve',o.id); notify(`${o.id} approved`,'approved'); return {status:o.status}; },
  rejectOrder(p){ const o=ord(p.id); if(!o)throw new Error('gone'); o.status='rejected'; audit('reject',o.id,p.reason||''); notify(`${o.id} rejected`,'rejected'); return {status:o.status}; },
  allocateOrder(p){ const o=ord(p.id); if(!o)throw new Error('gone'); if(o.status!=='approved')throw new Error('must be approved first');
    for(const it of o.items){const pr=prod(it.sku); if(!pr)continue; if(pr.stock<it.qty)throw new Error('insufficient stock for '+it.sku); }
    for(const it of o.items){const pr=prod(it.sku); pr.stock-=it.qty;}
    o.status='allocated'; o.allocatedBy=SESSION.role; audit('allocate',o.id); notify(`${o.id} stock allocated`,'allocated'); return {status:o.status}; },
  shipOrder(p){ const o=ord(p.id); if(!o)throw new Error('gone'); if(o.status!=='allocated')throw new Error('allocate before shipping'); o.status='shipped';
    const s={id:uid('SHP'),order:o.id,carrier:p.carrier||'AntonovAir',eta:now()+Math.floor(Math.random()*5)*86400000}; DB.shipments.unshift(s); audit('ship',o.id); notify(`${o.id} shipped via ${s.carrier}`,'shipped'); return {shipment:s.id}; },
  invoiceOrder(p){ const o=ord(p.id); if(!o)throw new Error('gone'); const total=orderTotal(o); const inv={id:uid('INV'),order:o.id,total,paid:false}; DB.invoices.unshift(inv); audit('invoice',o.id,money(total)); return {invoice:inv.id,total}; },
  flagOrder(p){ const o=ord(p.id); if(!o)throw new Error('gone'); if(!o.flags.includes(p.flag))o.flags.push(p.flag); audit('flag',o.id,p.flag); return {flags:o.flags}; },
  setRule(p){ Object.assign(DB.rules,p); audit('rule','system',JSON.stringify(p)); DB.orders.forEach(applyRulesTo); notify('Pricing/credit rules changed — existing orders re-evaluated','rules-changed'); return {rules:DB.rules}; },
  deleteOrder(p){ const i=DB.orders.findIndex(o=>o.id===p.id); if(i<0)throw new Error('gone'); const[o]=DB.orders.splice(i,1); audit('delete',p.id); notify(`${p.id} DELETED`,'deleted'); return {deleted:p.id}; },
  adjustStock(p){ const pr=prod(p.sku); if(!pr)throw new Error('no sku'); pr.stock=Math.max(0,pr.stock+p.delta); audit('stock',p.sku,String(p.delta)); return {stock:pr.stock}; },
  payInvoice(p){ const inv=DB.invoices.find(i=>i.id===p.id); if(!inv)throw new Error('gone'); inv.paid=true; audit('pay',inv.order); return {paid:true}; },
};
function ord(id){return DB.orders.find(o=>o.id===id);}
function prod(sku){return DB.products.find(p=>p.sku===sku);}
function orderTotal(o){return o.items.reduce((s,it)=>{const p=prod(it.sku);return s+(p?p.price*it.qty:0);},0);}
/* THE CASCADE: admin rules retro-mutate operator/editor orders */
function applyRulesTo(o){
  const base=orderTotal(o);
  o.priceRuleApplied=DB.rules.marginPct;
  // credit hold on region
  o.flags=o.flags.filter(f=>f!=='credit-hold'&&f!=='auto-flag'&&f!=='hazmat');
  if(DB.rules.creditHoldRegions.includes(o.region))o.flags.push('credit-hold');
  if(base*(1+DB.rules.marginPct/100)>=DB.rules.autoFlagOver)o.flags.push('auto-flag');
  if(DB.rules.hazmatRequiresFlag && o.items.some(it=>it.sku==='ANV-400'))o.flags.push('hazmat');
}
function audit(action,target,detail=''){DB.audit.unshift({t:now(),role:SESSION?.role||'system',action,target,detail});if(DB.audit.length>200)DB.audit.pop();}
function notify(msg,kind){DB.notifs.unshift({t:now(),msg,kind,read:false});if(DB.notifs.length>50)DB.notifs.pop();renderNotifCount();}

/* ---------- cross-tab / cross-role live sync (state changes UNDER you) ---------- */
const bus=new BroadcastChannel('antonov_erp');
bus.onmessage=(e)=>{ if(e.data==='changed'){ DB=load()||DB; renderNotifCount(); if(currentView)routeTo(currentView,true); } };
function broadcast(){ persist(); try{bus.postMessage('changed');}catch{} }

/* ---------- toast (SOMETIMES LIES) ---------- */
function toast(msg,type='good',opts={}){
  const t=el('div',{class:'toast '+type},msg);
  $('#toastHost').append(t);
  setTimeout(()=>t.remove(), opts.ms||2600);
}

/* ============ LOGIN ============ */
function doLogin(){
  const u=$('#loginUser').value.trim().toLowerCase(), p=$('#loginPass').value;
  const err=$('#loginErr');
  if(CREDS[u] && CREDS[u]===p){
    SESSION={role:u};
    $('#loginScreen').classList.add('hidden'); $('#app').classList.remove('hidden');
    $('#roleBadge').textContent=u.toUpperCase(); $('#whoami').textContent='@'+u;
    buildSidebar(); routeTo(ROLE_CAPS[u].nav[0]); renderNotifCount();
    // deliberate: NO success toast on login (verify-by-effect: the only signal is the app rendering)
  } else {
    err.textContent='Invalid credentials'; err.classList.remove('hidden');
    setTimeout(()=>err.classList.add('hidden'),2200);
  }
}
$('#loginBtn').addEventListener('click',doLogin);
$('#loginPass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

$('#logoutBtn').addEventListener('click',()=>{ SESSION=null; $('#app').classList.add('hidden'); $('#loginScreen').classList.remove('hidden'); $('#loginUser').value='';$('#loginPass').value=''; });
$('#notifBtn').addEventListener('click',openNotifs);
$('#whoami').addEventListener('click',()=>toast('Signed in as '+SESSION.role,'good'));

/* ============ SIDEBAR / ROUTING ============ */
let currentView=null;
function buildSidebar(){
  const sb=$('#sidebar'); sb.innerHTML='';
  for(const key of ROLE_CAPS[SESSION.role].nav){
    const it=el('div',{class:'navItem',role:'button','data-testid':'nav-'+key,'data-nav':key,
      onclick:()=>routeTo(key)}, el('span',{},NAV_LABEL[key]), el('small',{},NAV_META[key]));
    sb.append(it);
  }
}
function setActiveNav(key){ $$('.navItem').forEach(n=>n.classList.toggle('active',n.dataset.nav===key)); }
function routeTo(key,keepScroll){
  if(!ROLE_CAPS[SESSION.role].nav.includes(key)){ toast('Access denied for '+SESSION.role,'bad'); return; }
  currentView=key; setActiveNav(key);
  try{location.hash=NAV_META[key];}catch{}
  const main=$('#main'); const sc=keepScroll?main.scrollTop:0;
  main.innerHTML=''; (VIEWS[key]||VIEWS.dashboard)(main); main.scrollTop=sc;
}

/* ============ VIEWS ============ */
const VIEWS={};

VIEWS.dashboard=(root)=>{
  root.append(el('h1',{},'Dashboard'), el('p',{class:'muted'},'Signed in as '+SESSION.role));
  const stats=el('div',{class:'grid2'});
  const byStatus={};DB.orders.forEach(o=>byStatus[o.status]=(byStatus[o.status]||0)+1);
  stats.append(
    statCard('Open Orders',DB.orders.filter(o=>!['shipped','rejected'].includes(o.status)).length),
    statCard('Awaiting Approval',DB.orders.filter(o=>o.status==='submitted').length),
    statCard('Flagged',DB.orders.filter(o=>o.flags.length).length),
    statCard('Low Stock SKUs',DB.products.filter(p=>p.stock<5).length),
  );
  root.append(stats);
  root.append(el('h2',{},'Recent activity'));
  const tbl=el('table',{},el('thead',{},el('tr',{},el('th',{},'When'),el('th',{},'Role'),el('th',{},'Action'),el('th',{},'Target'))));
  const tb=el('tbody');
  DB.audit.slice(0,8).forEach(a=>tb.append(el('tr',{},el('td',{},new Date(a.t).toLocaleTimeString()),el('td',{},a.role),el('td',{},a.action),el('td',{},a.target))));
  tbl.append(tb); root.append(el('div',{class:'card'},tbl));
  // live refresh hint (this panel silently changes when other roles act)
  root.append(el('p',{class:'muted',style:'margin-top:12px;font-size:12px'},'This board reflects all roles live. Actions elsewhere change it under you.'));
};
function statCard(label,val){return el('div',{class:'card'},el('div',{class:'muted'},label),el('div',{style:'font-size:28px;font-weight:700;margin-top:4px'},String(val)));}

VIEWS.orders=(root)=>{
  root.append(el('h1',{},'Orders'));

let ordersFilter='all',ordersSearch='';
function renderOrdersTable(){
  const host=$('#ordersTableHost'); if(!host)return;
  let rows=DB.orders.slice();
  if(ordersFilter!=='all')rows=rows.filter(o=>o.status===ordersFilter);
  if(ordersSearch)rows=rows.filter(o=>o.customer.toLowerCase().includes(ordersSearch.toLowerCase()));
  const tbl=el('table',{});
  tbl.append(el('thead',{},el('tr',{},['','Order','Customer','Region','Total','Status','Flags','Actions'].map(h=>el('th',{},h)))));
  const tb=el('tbody');
  rows.forEach(o=>{
    const tr=el('tr',{'data-row':o.id,'data-testid':'order-'+o.id,onclick:(e)=>{if(e.target.closest('button,.combo'))return;openOrderDrawer(o.id);}});
    tr.append(
      el('td',{},el('input',{type:'checkbox','data-testid':'sel-'+o.id})),
      el('td',{},o.id),
      el('td',{},o.customer),
      el('td',{},o.region),
      el('td',{},money(orderTotal(o))),
      el('td',{},el('span',{class:'pill '+o.status},o.status)),
      el('td',{},o.flags.map(f=>el('span',{class:'pill flagged',style:'margin-right:3px'},f))),
      el('td',{},orderActions(o)),
    );
    tb.append(tr);
  });
  if(!rows.length)tb.append(el('tr',{},el('td',{colspan:'8',class:'muted',style:'padding:20px'},'No orders match.')));
  tbl.append(tb); host.innerHTML=''; host.append(el('div',{class:'card'},tbl));
}
function orderActions(o){
  const wrap=el('div',{class:'row',style:'gap:5px'});
  const role=SESSION.role;
  // AMBIGUITY: many actions share label "Edit"/"Approve" but do different things per role/state
  if(role==='operator'&&o.status==='draft'&&o.createdBy==='operator')
    wrap.append(actBtn('Submit',()=>run('submitOrder',{id:o.id},o.id,'submitted')));
  if(cap('approve')&&o.status==='submitted'){
    wrap.append(actBtn('Approve',()=>run('approveOrder',{id:o.id},o.id,'approved'),'primary'));
    wrap.append(actBtn('Reject',()=>run('rejectOrder',{id:o.id,reason:'manual'},o.id,'rejected'),'ghost'));
  }
  if(cap('allocate')&&o.status==='approved')
    wrap.append(actBtn('Allocate',()=>run('allocateOrder',{id:o.id},o.id,'allocated'),'primary'));
  if(cap('ship')&&o.status==='allocated')
    wrap.append(actBtn('Ship',()=>run('shipOrder',{id:o.id},o.id,'shipped'),'primary'));
  if(cap('invoice')&&['allocated','shipped'].includes(o.status))
    wrap.append(actBtn('Invoice',()=>run('invoiceOrder',{id:o.id},o.id,null)));
  if(cap('flag'))wrap.append(actBtn('Flag',()=>openFlagModal(o.id),'ghost tiny'));
  if(cap('delete'))wrap.append(actBtn('Delete',()=>confirmDelete(o.id),'danger tiny'));
  if(!wrap.children.length)wrap.append(el('span',{class:'muted'},'—'));
  return wrap;
}
function actBtn(label,fn,cls='tiny'){return el('button',{class:cls.includes('tiny')?cls:cls+' tiny','data-testid':'act-'+label.toLowerCase(),onclick:(e)=>{e.stopPropagation();fn();}},label);}
function cap(x){return ROLE_CAPS[SESSION.role].can.includes(x);}

/* THE CORE VERIFY-BY-EFFECT RUNNER: optimistic update, real API, revert on fail, lying toast sometimes */
async function run(action,payload,orderId,optimisticStatus){
  const o=orderId?ord(orderId):null;
  const prev=o?o.status:null;
  // OPTIMISTIC: flip the UI immediately (before the server confirms)
  if(o&&optimisticStatus){o.status=optimisticStatus;renderOrdersTable();}
  const res=await api(action,payload);
  if(res.ok){
    broadcast(); renderOrdersTable(); renderNotifCount();
    // 15% of the time the toast LIES about which thing happened (wrong order id)
    const lie=Math.random()<0.15;
    toast(lie?('Order '+(uid('ORD'))+' updated'):(action.replace('Order','')+' ok'),'good');
  } else {
    if(res.appliedAnyway){
      // NASTIEST: server said 500 but it DID apply. UI reverts (wrong!), data is actually changed.
      if(o&&prev)o.status=prev; renderOrdersTable();
      toast('Something went wrong (500). Please retry.','bad');
    } else {
      if(o&&prev){o.status=prev;renderOrdersTable();}
      toast('Failed (500)','bad');
    }
  }
}

VIEWS.create=(root)=>{
  if(!cap('create')){root.append(el('p',{class:'muted'},'No access.'));return;}
  root.append(el('h1',{},'New Order'));
  // MULTI-STEP WIZARD with a delayed-reveal final step + a disabled Create until valid
  const stepEls=['Customer','Items','Review'].map((s,i)=>el('div',{class:'step'+(i===0?' active':''),'data-step':i},s));
  root.append(el('div',{class:'steps'},stepEls));
  const state={step:0,customer:'',region:'APAC',items:[],note:''};
  const host=el('div',{class:'card',id:'wizHost'}); root.append(host);
  const renderStep=()=>{
    host.innerHTML=''; stepEls.forEach((e,i)=>{e.className='step'+(i===state.step?' active':i<state.step?' done':'');});
    if(state.step===0){
      host.append(el('label',{class:'muted'},'Customer name'),el('input',{id:'wcust',value:state.customer,placeholder:'e.g. Doon Logistics'}));
      const rc=buildCombo(state.region||'Region…',['APAC','EMEA','AMER','LATAM'],(v)=>{state.region=v;});
      host.append(el('div',{style:'margin-top:10px'},el('label',{class:'muted'},'Region'),rc));
      host.append(el('div',{class:'row',style:'margin-top:16px;justify-content:flex-end'},
        el('button',{class:'primary',onclick:()=>{state.customer=$('#wcust').value.trim();if(!state.customer){toast('Customer required','warn');return;}state.step=1;renderStep();}},'Next →')));
    } else if(state.step===1){
      host.append(el('label',{class:'muted'},'Add line items'));
      const itemHost=el('div',{class:'col',style:'margin-top:8px'});
      const drawItems=()=>{itemHost.innerHTML='';state.items.forEach((it,idx)=>{const p=prod(it.sku);itemHost.append(el('div',{class:'row'},el('span',{style:'flex:1'},`${it.sku} · ${p?p.name:'?'} × ${it.qty} = ${money((p?.price||0)*it.qty)}`),el('button',{class:'ghost tiny',onclick:()=>{state.items.splice(idx,1);drawItems();}},'✕')));});if(!state.items.length)itemHost.append(el('span',{class:'muted'},'No items yet.'));};
      drawItems();
      host.append(itemHost);
      const addRow=el('div',{class:'row',style:'margin-top:10px'});
      const skuSel=el('select',{},...DB.products.map(p=>el('option',{value:p.sku},`${p.sku} — ${p.name} (${p.stock} in stock)`)));
      const qty=el('input',{type:'number',value:'1',min:'1',style:'max-width:90px'});
      addRow.append(skuSel,qty,el('button',{onclick:()=>{state.items.push({sku:skuSel.value,qty:Math.max(1,+qty.value||1)});drawItems();}},'Add'));
      host.append(addRow);
      host.append(el('div',{class:'row',style:'margin-top:16px;justify-content:space-between'},
        el('button',{class:'ghost',onclick:()=>{state.step=0;renderStep();}},'← Back'),
        el('button',{class:'primary',onclick:()=>{if(!state.items.length){toast('Add at least one item','warn');return;}state.step=2;renderStep();}},'Review →')));
    } else {
      host.append(el('div',{class:'muted'},'Review & submit'));
      host.append(el('div',{class:'kv'},el('span',{},'Customer'),el('b',{},state.customer)));
      host.append(el('div',{class:'kv'},el('span',{},'Region'),el('b',{},state.region)));
      host.append(el('div',{class:'kv'},el('span',{},'Items'),el('b',{},String(state.items.length))));
      host.append(el('div',{class:'kv'},el('span',{},'Est. total'),el('b',{},money(state.items.reduce((s,it)=>s+((prod(it.sku)?.price||0)*it.qty),0)))));
      host.append(el('label',{class:'muted',style:'margin-top:10px;display:block'},'Note'),el('textarea',{id:'wnote',rows:'2',placeholder:'optional'}));
      // DELAYED-ENABLE: Create button is disabled, enables 700ms after a "validation" spinner
      const createBtn=el('button',{class:'primary',disabled:'true','data-testid':'wizard-create'},'Create Order');
      const spin=el('span',{class:'muted'},el('span',{class:'spinner'}),' validating…');
      host.append(el('div',{class:'row',style:'margin-top:16px;justify-content:space-between'},
        el('button',{class:'ghost',onclick:()=>{state.step=1;renderStep();}},'← Back'),
        el('div',{class:'row'},spin,createBtn)));
      setTimeout(()=>{createBtn.disabled=false;spin.remove();},700);
      createBtn.addEventListener('click',async()=>{
        createBtn.disabled=true;
        state.note=$('#wnote').value;
        const res=await api('createOrder',{customer:state.customer,region:state.region,items:state.items,note:state.note,priority:'normal'});
        if(res.ok){ broadcast(); toast('Order '+res.data.id+' created','good'); routeTo('orders'); }
        else if(res.appliedAnyway){ broadcast(); toast('Create failed (500)','bad'); /* but it EXISTS — verify torture */ }
        else { createBtn.disabled=false; toast('Create failed (500) — retry','bad'); }
      });
    }
  };
  renderStep();
};

/* ALLOCATION BOARD — drag/drop kanban (editor). Dragging a chip between lanes triggers a real state transition. */
VIEWS.board=(root)=>{
  root.append(el('h1',{},'Allocation Board'),el('p',{class:'muted'},'Drag orders between lanes to transition them. Others may move them under you.'));
  const lanes=[['submitted','Submitted'],['approved','Approved'],['allocated','Allocated'],['shipped','Shipped']];
  const board=el('div',{class:'board'});
  lanes.forEach(([status,label])=>{
    const lane=el('div',{class:'lane','data-lane':status,'data-testid':'lane-'+status});
    lane.append(el('h3',{},label));
    DB.orders.filter(o=>o.status===status).forEach(o=>{
      const chip=el('div',{class:'chip',draggable:'true','data-chip':o.id,'data-testid':'chip-'+o.id},
        el('b',{},o.id),el('div',{class:'muted',style:'font-size:12px'},o.customer),
        el('div',{},o.flags.map(f=>el('span',{class:'pill flagged',style:'margin-right:3px;font-size:11px'},f))));
      chip.addEventListener('dragstart',e=>{e.dataTransfer.setData('text',o.id);chip.classList.add('drag');});
      chip.addEventListener('dragend',()=>chip.classList.remove('drag'));
      lane.append(chip);
    });
    lane.addEventListener('dragover',e=>{e.preventDefault();lane.classList.add('over');});
    lane.addEventListener('dragleave',()=>lane.classList.remove('over'));
    lane.addEventListener('drop',async e=>{
      e.preventDefault();lane.classList.remove('over');
      const id=e.dataTransfer.getData('text');const o=ord(id);if(!o)return;
      // map lane→action; ILLEGAL transitions are rejected by the API (torture: some drops silently do nothing)
      const map={approved:'approveOrder',allocated:'allocateOrder',shipped:'shipOrder'};
      const action=map[status]; if(!action){toast('Cannot move to '+status,'warn');return;}
      const res=await api(action,{id});
      if(res.ok){broadcast();routeTo('board',true);toast(id+' → '+status,'good');}
      else{routeTo('board',true);toast('Move failed (500)','bad');}
    });
    board.append(lane);
  });
  root.append(board);
};

VIEWS.bigdata=(root)=>{
  root.append(el('h1',{},'Data Explorer'),el('p',{class:'muted'},'Scroll to lazy-load. Row content loads asynchronously.'));
  const box=el('div',{id:'bigList'}); root.append(box);
  let loaded=0;const total=500;
  const loadMore=()=>{const end=Math.min(loaded+30,total);for(;loaded<end;loaded++){box.append(el('div',{class:'listRow','data-testid':'bigrow-'+loaded},el('span',{class:'spinner'}),' loading record #'+(loaded+1)+'…'));}
    // async fill (each row resolves later — an observer sees spinners first)
    const rows=$$('.listRow',box);
    rows.forEach((r,i)=>{if(r.dataset.filled)return;r.dataset.filled='1';setTimeout(()=>{r.innerHTML='';r.append('Record #'+(i+1)+' — SKU '+DB.products[i%DB.products.length].sku+' — qty '+((i*7)%97));},300+Math.random()*900);});
  };
  loadMore();
  box.addEventListener('scroll',()=>{if(box.scrollTop+box.clientHeight>=box.scrollHeight-40&&loaded<total)loadMore();});
};

/* custom combobox — TRANSIENT menu (opens on click, closes on outside-click/reselect). The dropdown torture. */
function buildCombo(placeholder,options,onPick){
  const wrap=el('div',{class:'combo',style:'min-width:180px'});
  const btn=el('div',{role:'combobox','aria-haspopup':'listbox','aria-expanded':'false',tabindex:'0','data-testid':'combo','style':'border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer;background:#0c0f15'},placeholder);
  let menu=null;
  const close=()=>{if(menu){menu.remove();menu=null;btn.setAttribute('aria-expanded','false');}};
  const open=()=>{ if(menu){close();return;} btn.setAttribute('aria-expanded','true');
    menu=el('div',{class:'comboMenu',role:'listbox'});
    options.forEach(o=>menu.append(el('div',{class:'comboOpt',role:'option',onclick:(e)=>{e.stopPropagation();btn.textContent=o;onPick(o);close();}},o)));
    wrap.append(menu);
    setTimeout(()=>document.addEventListener('click',outside),0);
  };
  const outside=(e)=>{if(!wrap.contains(e.target)){close();document.removeEventListener('click',outside);}};
  btn.addEventListener('click',(e)=>{e.stopPropagation();open();});
  wrap.append(btn); return wrap;
}

  d.append(el('div',{class:'row',style:'justify-content:space-between'},el('h2',{style:'margin:0'},o.id),el('button',{class:'ghost tiny',onclick:()=>d.classList.remove('open')},'✕')));

  d.append(el('div',{class:'kv'},el('span',{},'Region'),el('b',{},o.region)));
  d.append(el('div',{class:'kv'},el('span',{},'Status'),el('span',{class:'pill '+o.status},o.status)));
  d.append(el('div',{class:'kv'},el('span',{},'Created by'),el('b',{},o.createdBy)));
  d.append(el('div',{class:'kv'},el('span',{},'Approved by'),el('b',{},o.approvedBy||'—')));
  d.append(el('div',{class:'kv'},el('span',{},'Total'),el('b',{},money(orderTotal(o)))));
  d.append(el('div',{class:'kv'},el('span',{},'Flags'),el('b',{},o.flags.join(', ')||'none')));
  d.append(el('h2',{},'Items'));
  o.items.forEach(it=>{const p=prod(it.sku);d.append(el('div',{class:'kv'},el('span',{},(p?p.name:it.sku)),el('span',{},'× '+it.qty)));});

function confirmDanger(msg,fn){
  showModal(msg,(body,close)=>{
    body.append(el('p',{},'Type DELETE to confirm.'));
    const inp=el('input',{placeholder:'DELETE'});body.append(inp);
    body.append(el('div',{class:'row',style:'justify-content:flex-end;gap:8px;margin-top:10px'},
      el('button',{class:'ghost',onclick:close},'Cancel'),
      el('button',{class:'danger',onclick:()=>{if(inp.value==='DELETE'){fn();close();}else toast('Type DELETE exactly','warn');}},'Confirm')));
  });
}
/* modal — focus-trapping */
function showModal(title,build){
  const host=$('#modalHost');
  const wrap=el('div',{class:'modalWrap','data-testid':'modal'});
  const card=el('div',{class:'card modal'});
  card.append(el('div',{class:'row',style:'justify-content:space-between'},el('h2',{style:'margin:0'},title),el('button',{class:'ghost tiny',onclick:()=>wrap.remove()},'✕')));
  const body=el('div',{style:'margin-top:10px'}); card.append(body);
  build(body,()=>wrap.remove());
  wrap.append(card); host.append(wrap);
  wrap.addEventListener('click',e=>{if(e.target===wrap)wrap.remove();});
  const foc=card.querySelector('input,button'); foc&&foc.focus();
}

/* notifications */
function renderNotifCount(){const n=DB.notifs.filter(x=>!x.read).length;const c=$('#notifCount');if(c)c.textContent=n;}
function openNotifs(){
  showModal('Notifications',(body,close)=>{
    if(!DB.notifs.length){body.append(el('p',{class:'muted'},'Nothing yet.'));return;}
    DB.notifs.slice(0,20).forEach(n=>body.append(el('div',{class:'kv'},el('span',{},n.msg),el('span',{class:'muted'},new Date(n.t).toLocaleTimeString()))));
    DB.notifs.forEach(n=>n.read=true);persist();renderNotifCount();
    body.append(el('button',{class:'ghost tiny',style:'margin-top:8px',onclick:()=>{DB.notifs=[];persist();renderNotifCount();close();}},'Clear all'));
  });
}

/* clock + periodic "another role acted" simulation is OFF by default (deterministic for testing),
   but cross-tab bus makes real multi-role sessions affect each other live. */
setInterval(()=>{const c=$('#clock');if(c&&SESSION)c.textContent=new Date().toLocaleTimeString();},1000);

/* boot: if a hash points somewhere and we're logged in (reload), restore */
window.addEventListener('load',()=>{ $('#loginUser').focus(); });
</script>
